[project]
name = "liebmich-analysis"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.8.*",
  "torchaudio==2.8.*",
  "demucs>=4.0.1",
  "librosa>=0.10",
  "soundfile>=0.12",
  "numpy<2.3",
  "faster-whisper>=1.2.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
