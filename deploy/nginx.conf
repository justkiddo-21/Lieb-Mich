server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
